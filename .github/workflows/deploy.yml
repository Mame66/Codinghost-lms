name: 🚀 Deploy Frontend to IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build React & Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📚 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Build React app
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          CI: false

      - name: 🚀 Deploy to IONOS via SFTP
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            open sftp://${{ secrets.SFTP_USERNAME }}:${{ secrets.SFTP_PASSWORD }}@access-5019368371.webspace-host.com:22;
            mirror -R --delete --verbose ./frontend/build/ /lms-frontend/;
            bye
          "

      - name: ✅ Succès
        if: success()
        run: echo "✅ Déployé avec succès sur codinghost.fr"

      - name: ❌ Échec
        if: failure()
        run: echo "❌ Échec du déploiement"